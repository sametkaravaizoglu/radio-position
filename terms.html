<html lang="tr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadioPosition — Kullanım Koşulları (Terms of Use)</title>
    <style>
        :root {
            --primary-color: #ff6b4a;
            --bg-color: #ffffff;
            --text-main: #1c1c1e;
            --text-muted: #636366;
            --border-color: #e5e5ea;
            --card-bg: #f2f2f7;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --primary-color: #ff6b4a;
                --bg-color: #000000;
                --text-main: #ffffff;
                --text-muted: #8e8e93;
                --border-color: #2c2c2e;
                --card-bg: #1c1c1e;
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.7;
            color: var(--text-main);
            background-color: var(--bg-color);
            padding: 24px 20px 60px;
            max-width: 840px;
            margin: 0 auto;
        }
        h1 {
            color: var(--primary-color);
            font-size: 26px;
            font-weight: 800;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 14px;
            margin-bottom: 8px;
        }
        .update-date {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }
        h2 {
            font-size: 19px;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 28px;
            margin-bottom: 12px;
            border-left: 4px solid var(--primary-color);
            padding-left: 10px;
        }
        p, li {
            font-size: 14.5px;
            color: var(--text-main);
        }
        ul {
            padding-left: 20px;
            margin-bottom: 16px;
        }
        li {
            margin-bottom: 8px;
        }
        .highlight-box {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px 20px;
            margin: 16px 0;
            border: 1px solid var(--border-color);
        }
        .footer {
            margin-top: 50px;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            text-align: center;
        }
        a {
            color: var(--primary-color);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .lang-select {
            padding: 8px 14px;
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 13.5px;
            font-weight: 600;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            outline: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

                <option value="en">🇺🇸 English</option>
                <option value="de">🇩🇪 Deutsch</option>
                <option value="es">🇪🇸 Español</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="it">🇮🇹 Italiano</option>
                <option value="nl">🇳🇱 Nederlands</option>

                <option value="ko">🇰🇷 한국어</option>
                <option value="zh">🇨🇳 中文</option>
            </select>
            <a href="index.html" id="back-home-btn" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background-color: var(--card-bg); color: var(--text-main); font-size: 13.5px; font-weight: 600; border-radius: 20px; border: 1px solid var(--border-color); text-decoration: none;">
                ← Anasayfaya Dön
            </a>
        </div>
    </header>

    <main id="terms-container"></main>

    <div class="footer">
        © 2026 RadioPosition. All Rights Reserved.

        function renderTerms(lang) {
            const t = termsTexts[lang] || termsTexts.en;
            document.getElementById('back-home-btn').textContent = t.backBtn;
            document.title = t.title + " — RadioPosition";

            document.getElementById('terms-container').innerHTML = `
                <h1>${t.title}</h1>
                <div class="update-date">${t.date}</div>
                <p>${t.intro}</p>
                <h2>${t.h1}</h2>
                <p>${t.p1}</p>
                <h2>${t.h2}</h2>
                <div class="highlight-box">${t.box2}</div>
                <p>${t.p2}</p>
                <h2>${t.h3}</h2>
                <p>${t.p3}</p>
                <h2>${t.h4}</h2>
                <p>${t.p4}</p>
            `;
        }

        const selectEl = document.getElementById('doc-lang-select');
        const savedLang = localStorage.getItem('radio_position_lang') || 'tr';
        selectEl.value = termsTexts[savedLang] ? savedLang : 'tr';

        selectEl.addEventListener('change', (e) => {
            const selected = e.target.value;
            localStorage.setItem('radio_position_lang', selected);
            renderTerms(selected);
        });

        renderTerms(selectEl.value);
    </script>
</body>
</html>
