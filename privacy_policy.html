<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3429247192277407"
       crossorigin="anonymous"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadioPosition — Gizlilik Politikası (Privacy Policy)</title>
    <style>
        :root {
            --primary-color: #ff6b4a;
            --bg-color: #ffffff;
            --text-main: #1c1c1e;
            --text-muted: #636366;
            --border-color: #e5e5ea;
            --card-bg: #f2f2f7;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --primary-color: #ff6b4a;
                --bg-color: #000000;
                --text-main: #ffffff;
                --text-muted: #8e8e93;
                --border-color: #2c2c2e;
                --card-bg: #1c1c1e;
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.7;
            color: var(--text-main);
            background-color: var(--bg-color);
            padding: 24px 20px 60px;
            max-width: 840px;
            margin: 0 auto;
        }
        h1 {
            color: var(--primary-color);
            font-size: 26px;
            font-weight: 800;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 14px;
            margin-bottom: 8px;
        }
        .update-date {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }
        h2 {
            font-size: 19px;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 28px;
            margin-bottom: 12px;
            border-left: 4px solid var(--primary-color);
            padding-left: 10px;
        }
        p, li {
            font-size: 14.5px;
            color: var(--text-main);
        }
        ul {
            padding-left: 20px;
            margin-bottom: 16px;
        }
        li {
            margin-bottom: 8px;
        }
        .highlight-box {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px 20px;
            margin: 16px 0;
            border: 1px solid var(--border-color);
        }
        .footer {
            margin-top: 50px;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            text-align: center;
        }
        a {
            color: var(--primary-color);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .lang-select {
            padding: 8px 14px;
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 13.5px;
            font-weight: 600;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            outline: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); flex-wrap: wrap; gap: 12px;">
        <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;">
            <img src="assets/logo-removebg.png" alt="RadioPosition Logo" style="width: 38px; height: 38px; object-fit: contain;">
            <span style="font-size: 20px; font-weight: 800; letter-spacing: -0.5px; color: var(--text-main);">Radio<span style="color: var(--primary-color);">Position</span></span>
        </a>
        <div style="display: flex; align-items: center; gap: 10px;">
            <select id="doc-lang-select" class="lang-select">
                <option value="tr">🇹🇷 Türkçe</option>
                <option value="en">🇺🇸 English</option>
                <option value="de">🇩🇪 Deutsch</option>
                <option value="es">🇪🇸 Español</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="it">🇮🇹 Italiano</option>
                <option value="nl">🇳🇱 Nederlands</option>
                <option value="pl">🇵🇱 Polski</option>
                <option value="pt">🇵🇹 Português</option>
                <option value="ru">🇷🇺 Русский</option>
                <option value="ar">🇪🇬 العربية</option>
                <option value="hi">🇮🇳 हिन्दी</option>
                <option value="ja">🇯🇵 日本語</option>
                <option value="ko">🇰🇷 한국어</option>
                <option value="zh">🇨🇳 中文</option>
            </select>
            <a href="index.html" id="back-home-btn" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background-color: var(--card-bg); color: var(--text-main); font-size: 13.5px; font-weight: 600; border-radius: 20px; border: 1px solid var(--border-color); text-decoration: none;">
                ← Anasayfaya Dön
            </a>
        </div>
    </header>

    <main id="policy-container"></main>

    <div class="footer">
        © 2026 RadioPosition. All Rights Reserved.
    </div>

    <script>

                summary: "<strong>Özet:</strong> RadioPosition doğrudan isim, e-posta adresi veya telefon numarası gibi kişisel kimlik verilerini toplamaz. Favorileriniz ve tercihleriniz cihazınızda yerel olarak saklanır.",
                h1: "1. Toplanan ve İşlenen Veriler",
                p1: "Uygulamamızın sunduğu canlı radyo yayını dinleme, harita tabanlı konumlama ve zamanlayıcı hizmetlerini sağlamak amacıyla aşağıdaki anonim veri kategorileri işlenebilir:",

                h2: "2. Reklamlar ve Üçüncü Taraf Servisleri",

                l2: "<li><strong>Reklam Türleri:</strong> Banner, Geçiş (Interstitial), Yerel ve Ödüllü Video Reklamlar gösterilebilir.</li><li><strong>Reklam Kimliği:</strong> Google AdMob cihazınızın anonim reklam kimliğini (GAID/IDFA) işleyebilir.</li><li><strong>Analiz:</strong> Firebase Crashlytics & Analytics anonim istatistik toplayabilir.</li>",
                h3: "3. Uygulama İçi Satın Almalar ve Ödeme Güvenliği (IAP)",
                p3: "RadioPosition PRO aboneliği satın alımları doğrudan Google Play Store veya Apple App Store üzerinden gerçekleşir. Kart bilgileriniz tarafımızca kesinlikle saklanmaz.",
                h4: "4. İletişim",
                p4: "Sorularınız için: <a href=\"mailto:support@radioposition.app\">support@radioposition.app</a>"
            },
            en: {
                backBtn: "← Back to Home",
                title: "RadioPosition Privacy Policy",
                date: "Last Updated: July 29, 2026 | Version 1.0",
                intro: "RadioPosition (\"App\", \"We\") values the privacy and security of our users. This Privacy Policy outlines how your data is collected, used, and protected when using our services.",
                summary: "<strong>Summary:</strong> RadioPosition does not collect personal identity data such as names, emails, or phone numbers. Your favorites and settings remain stored locally on your device.",
                h1: "1. Data Collection & Usage",
                p1: "To deliver live radio streaming, map discovery, and timer functions, the following anonymous data categories may be processed:",
                l1: "<li><strong>Location Data (GPS):</strong> Used solely to show nearby stations on the map. Never saved on external servers.</li><li><strong>Local Preferences:</strong> Favorites and settings are stored locally on your device.</li><li><strong>Technical Info:</strong> Anonymous device and OS details processed to optimize playback performance.</li>",
                h2: "2. Advertisements & Third-Party Services",
                p2: "RadioPosition uses <strong>Google AdMob</strong> to keep our core features free for everyone.",
                l2: "<li><strong>Ad Formats:</strong> Banner, Interstitial, Native, and Rewarded video ads.</li><li><strong>Advertising Identifiers:</strong> Anonymous IDs (GAID/IDFA) processed for relevant ads.</li><li><strong>Analytics:</strong> Firebase Crashlytics and Analytics collect anonymous performance logs.</li>",
                h3: "3. In-App Purchases & Payment Security",
                p3: "All RadioPosition PRO subscription transactions are processed directly by Google Play Store or Apple App Store. Payment credentials are never stored by RadioPosition.",
                h4: "4. Contact Us",
                p4: "For inquiries, contact: <a href=\"mailto:support@radioposition.app\">support@radioposition.app</a>"
            },
            de: {
                backBtn: "← Zurück zur Startseite",
                title: "RadioPosition Datenschutz-Bestimmungen",
                date: "Zuletzt aktualisiert: 29. Juli 2026 | Version 1.0",
                intro: "RadioPosition misst dem Schutz Ihrer persönlichen Daten höchste Bedeutung bei. Diese Datenschutzrichtlinie legt offen, wie anonyme Daten verarbeitet werden.",
                summary: "<strong>Zusammenfassung:</strong> RadioPosition sammelt keine persönlichen Daten wie Namen oder E-Mail-Adressen. Favoriten werden lokal gespeichert.",
                h1: "1. Datenerhebung & Nutzung",
                p1: "Zur Bereitstellung von Radio-Streams, Karten und Timern werden folgende anonyme Daten verarbeitet:",
                l1: "<li><strong>Standortdaten:</strong> Zeigt nahegelegene Sender auf der Karte an. Wird nicht gespeichert.</li><li><strong>Lokale Einstellungen:</strong> Favoriten bleiben auf Ihrem Gerät gespeichert.</li>",
                h2: "2. Werbung & Drittanbieter",
                p2: "RadioPosition nutzt <strong>Google AdMob</strong> zur Finanzierung der kostenlosen Nutzung.",
                l2: "<li>Banner, Interstitial- und Belohnungsanzeigen können geschaltet werden.</li>",
                h3: "3. In-App-Käufe",
                p3: "Zahlungen für RadioPosition PRO werden sicher über den Google Play Store oder Apple App Store abgewickelt.",
                h4: "4. Kontakt",
                p4: "E-Mail: <a href=\"mailto:support@radioposition.app\">support@radioposition.app</a>"
            },
            es: {
                backBtn: "← Volver al Inicio",
                title: "RadioPosition Política de Privacidad",
                date: "Última actualización: 29 de julio de 2026 | Versión 1.0",
                intro: "RadioPosition respeta la privacidad de sus usuarios. Esta política explica cómo se recopilan y protegen los datos anónimos.",
                summary: "<strong>Resumen:</strong> RadioPosition no recopila información personal como nombres o correos. Sus favoritos se guardan localmente.",
                h1: "1. Datos Recopilados",
                p1: "Para ofrecer transmisiones de radio en vivo y mapas, procesamos datos anónimos:",
                l1: "<li><strong>Ubicación:</strong> Muestra estaciones cercanas en el mapa. No se almacena en servidores.</li><li><strong>Favoritos:</strong> Guardados localmente en su dispositivo.</li>",
                h2: "2. Publicidad",
                p2: "Utilizamos <strong>Google AdMob</strong> para ofrecer una experiencia gratuita.",
                l2: "<li>Se pueden mostrar anuncios Banner e Interstitials.</li>",
                h3: "3. Compras Integradas",
                p3: "Las suscripciones a RadioPosition PRO se procesan de forma segura a través de App Store o Google Play Store.",
                h4: "4. Contacto",
                p4: "Correo: <a href=\"mailto:support@radioposition.app\">support@radioposition.app</a>"
            },
            fr: {
                backBtn: "← Retour à l'accueil",
                title: "RadioPosition Politique de Confidentialité",
                date: "Dernière mise à jour : 29 juillet 2026 | Version 1.0",
                intro: "RadioPosition accorde una grande importance à la confidentialité des données de ses utilisateurs.",
                summary: "<strong>Résumé :</strong> RadioPosition ne collecte aucune donnée d'identité personnelle. Vos favoris restent enregistrés localement.",
                h1: "1. Collecte des Données",
                p1: "Pour le streaming radio en direct et les cartes, nous traitons des données anonymes :",
                l1: "<li><strong>Localisation :</strong> Utilise la position pour afficher les radios à proximité.</li><li><strong>Favoris :</strong> Stockés localement sur votre appareil.</li>",
                h2: "2. Publicités",
                p2: "RadioPosition utilise <strong>Google AdMob</strong> pour maintenir l'application gratuite.",
                l2: "<li>Affichage de bannières et d'annonces interstitielles.</li>",
                h3: "3. Achats In-App",
                p3: "Les abonnements RadioPosition PRO sont gérés de manière sécurisée par l'App Store ou Google Play Store.",
                h4: "4. Contact",
                p4: "E-mail : <a href=\"mailto:support@radioposition.app\">support@radioposition.app</a>"
            }
        };

        function renderPolicy(lang) {
            const t = privacyTexts[lang] || privacyTexts.en;
            document.getElementById('back-home-btn').textContent = t.backBtn;
            document.title = t.title + " — RadioPosition";

            document.getElementById('policy-container').innerHTML = `
                <h1>${t.title}</h1>
                <div class="update-date">${t.date}</div>
                <p>${t.intro}</p>
                <div class="highlight-box">${t.summary}</div>
                <h2>${t.h1}</h2>
                <p>${t.p1}</p>
                <ul>${t.l1}</ul>
                <h2>${t.h2}</h2>
                <p>${t.p2}</p>
                <ul>${t.l2}</ul>
                <h2>${t.h3}</h2>
                <p>${t.p3}</p>
                <h2>${t.h4}</h2>
                <p>${t.p4}</p>
            `;
        }

        const selectEl = document.getElementById('doc-lang-select');
        const savedLang = localStorage.getItem('radio_position_lang') || 'tr';
        selectEl.value = privacyTexts[savedLang] ? savedLang : 'tr';

        selectEl.addEventListener('change', (e) => {
            const selected = e.target.value;
            localStorage.setItem('radio_position_lang', selected);
            renderPolicy(selected);
        });

        renderPolicy(selectEl.value);
    </script>
</body>
</html>
